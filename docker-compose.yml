version: "3.9"

services:
  redis: 
    image: redis:7-alpine
    container_name: omnirag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck: 
      test: ["CMD" , "redis-cli" , "ping"]
      interval: 5s
      timeout: 3s 
      retries: 5 
  
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    container_name: omnirag_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/app/data
    
    depends_on:
      redis:
        condition: service_healthy
          
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  app: 
    build: 
      context: .
      dockerfile: Dockerfile.app
    
    container_name: omnirag_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_BASE: http://api:8000
    
    depends_on:
      api:
        condition: service_healthy
volumes:
  redis_data: